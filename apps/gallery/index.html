<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: #111;
      background: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(900px, 94vw);
      min-height: 100vh;
      margin: 0 auto;
      padding: 24px 0 70px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .image-container {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    img {
      display: block;
      max-width: 100%;
      max-height: calc(100vh - 110px);
      object-fit: contain;
    }

    .controls {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 14px 3vw;
      background: #fff;
    }

    button {
      padding: 0;
      border: 0;
      background: none;
      color: #111;
      font: inherit;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    button:hover {
      opacity: 0.5;
    }

    .identity {
      display: flex;
      gap: 18px;
      color: #999;
      font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .identity span {
      color: #555;
    }

    @media (max-width: 600px) {
      main {
        width: 92vw;
        padding-bottom: 80px;
      }

      img {
        max-height: calc(100vh - 120px);
      }

      .controls {
        align-items: flex-start;
        gap: 10px;
      }

      .identity {
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 6px 14px;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="image-container">
      <img id="image" src="" alt="Random image">
    </div>
  </main>

  <div class="controls">
    <button onclick="nextImage()">another image</button>

    <div class="identity">
      <div>pod <span>{{.PodName}}</span></div>
      <div>ip <span>{{.PodIP}}</span></div>
      <div>node <span>{{.NodeName}}</span></div>
    </div>
  </div>

  <script>
    function nextImage() {
      const id = Math.floor(Math.random() * 87) + 1;
      document.getElementById("image").src =
        "https://adimail.github.io/assets/images/random/" + id + ".jpeg";
    }

    nextImage();
  </script>
</body>
</html>
