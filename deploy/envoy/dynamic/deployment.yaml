apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy
  namespace: kubeingress-system
  labels:
    app: envoy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: envoy
  template:
    metadata:
      labels:
        app: envoy
    spec:
      containers:
      - name: envoy
        image: envoyproxy/envoy:v1.30.1
        args:
        - "-c"
        - "/etc/envoy/envoy.yaml"
        ports:
        - name: http
          containerPort: 10000
          hostPort: 80
        - name: admin
          containerPort: 9901
        volumeMounts:
        - name: config
          mountPath: /etc/envoy
      volumes:
      - name: config
        configMap:
          name: envoy-dynamic-bootstrap
