apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: kubeingress-system
  labels:
    app: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      containers:
      - name: dashboard
        image: dashboard:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
