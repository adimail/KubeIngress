apiVersion: v1
kind: Service
metadata:
  name: control-plane
  namespace: kubeingress-system
spec:
  type: ClusterIP
  ports:
  - name: grpc-xds
    port: 18000
    targetPort: 18000
    protocol: TCP
  - name: http-api
    port: 8080
    targetPort: 8080
    protocol: TCP
  selector:
    app: control-plane
